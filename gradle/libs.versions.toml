okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
tess-two = { group = "com.rmtheis", name = "tess-two", version.ref = "tessTwo" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifInterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
